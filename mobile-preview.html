<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Slide To Spell · Mobile Preview</title>
<link rel="icon" href="assets/app-icon.png">
<style>
* { box-sizing:border-box; }
html,body { width:100%; height:100%; margin:0; }
body { height:100dvh; display:grid; grid-template-rows:24px minmax(0,1fr); gap:10px; padding:12px; overflow:hidden; background:#e7e5da; color:#345338; font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif; }
header { display:flex; align-items:center; justify-content:space-between; gap:10px; width:min(100%,390px); margin:0 auto; font-size:12px; line-height:1.2; white-space:nowrap; }
header span { color:#66715d; }
a { color:inherit; text-underline-offset:3px; }
a:focus-visible { outline:3px solid #9f712d; outline-offset:3px; }
.preview-space { position:relative; min-width:0; min-height:0; }
.phone-frame { position:absolute; top:50%; left:50%; width:390px; height:844px; overflow:hidden; border-radius:18px; outline:1px solid #c3b694; background:#f8f4e8; box-shadow:0 10px 32px #34453425; transform:translate(-50%,-50%) scale(var(--preview-scale,1)); transform-origin:center; }
iframe { display:block; width:390px; height:844px; border:0; background:#f8f4e8; }
</style>
</head>
<body>
<header><strong>Mobile Preview</strong><span>390 × 844</span><a href="./">Exit Preview</a></header>
<main class="preview-space" aria-label="Mobile Game Preview"><div class="phone-frame"><iframe title="Slide To Spell Mobile Game"></iframe></div></main>
<script>
(() => {
  const space=document.querySelector('.preview-space'),frame=document.querySelector('.phone-frame'),game=frame.querySelector('iframe');
  const qa=new URLSearchParams(location.search).get('qa');
  const gameURL=qa&&/^[a-zA-Z0-9-]{1,80}$/.test(qa)?'./?qa='+encodeURIComponent(qa):'./';
  game.src=gameURL;document.querySelector('a').href=gameURL;
  const fit=()=>frame.style.setProperty('--preview-scale',String(Math.max(.05,Math.min(1,space.clientWidth/390,space.clientHeight/844))));
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(fit).observe(space);
  window.addEventListener('resize',fit);window.visualViewport?.addEventListener('resize',fit);
  fit();
})();
</script>
</body>
</html>
